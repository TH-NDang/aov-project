name: frontend
on:
  push:
    paths:
      - "frontend/**"
      - "backend/wiki-service/src/main/resources/contracts/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/wiki-service/src/main/resources/contracts/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm generate:hero-api
      - run: git diff --exit-code -- apps/admin-aov/src/features/publishing/generated/hero-api.d.ts
      # Includes the Admin test files (tests/tsconfig.json), which the test runner does not type-check.
      - run: pnpm typecheck
      # Rules about the source itself (text size, confirm boxes, module boundaries); they read files, so they are not tests.
      - run: pnpm lint
      # Every package runs all of its tests/*.test.* files, so a new test file is picked up without editing a list.
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-builds
          path: frontend/apps/*/dist/
          retention-days: 7
