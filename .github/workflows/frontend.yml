name: frontend
on:
  push:
    paths:
      - "frontend/**"
      - "backend/wiki-service/src/main/resources/contracts/**"
      - "resources/Lien-Quan-v3/data/heroes.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/wiki-service/src/main/resources/contracts/**"
      - "resources/Lien-Quan-v3/data/heroes.json"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:hero-api
      - run: git diff --exit-code -- apps/admin-aov/src/features/publishing/generated/hero-api.d.ts
      - run: pnpm typecheck
      - run: pnpm --filter @aov/admin-aov test:publishing
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-builds
          path: frontend/apps/*/dist/
          retention-days: 7
