# Runs the pre-commit English comment check on the pushed commits, for clones that never enabled the hooks.
name: comments

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  english:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # The base is the pull request base, or the commit the push started from; a new branch compares with main.
      - name: English comments in added lines
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git merge-base origin/main HEAD)"
          fi
          node .githooks/check-english-comments.mjs --range "$BASE...HEAD"
