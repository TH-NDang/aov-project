# Unit tests of the research importers. Tests that read the pulled source collections (ADR-030) skip here and run
# locally after "pnpm sources:sync pull".
name: research

on:
  push:
    paths:
      - "research/**"
      - ".github/workflows/research.yml"
  pull_request:
    paths:
      - "research/**"
      - ".github/workflows/research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Character image importers
        working-directory: research/character-images
        run: python -m unittest discover --pattern "test_*.py"
      - name: Warehouse importer
        working-directory: research/warehouse
        run: python -m unittest discover --pattern "test_*.py"
