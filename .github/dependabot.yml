# Weekly update pull requests, security fixes included, for every place that pins a dependency.
# Patch and minor updates of one ecosystem come in one pull request so they do not flood the queue.
# Images skip major versions: a new major of Postgres needs its data upgraded, and a new Java or Node major needs the
# code and the build checked first, so those upgrades are planned by hand.
version: 2
updates:
  - package-ecosystem: maven
    directories:
      - /backend/wiki-service
      - /backend/community-service
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /backend/wiki-service
      - /backend/community-service
      - /infra/keycloak
      - /infra/proxy
      - /infra/web
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories:
      - /infra
      - /backend/wiki-service
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
