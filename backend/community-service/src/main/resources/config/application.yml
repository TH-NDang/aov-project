server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: community-service
  datasource:
    url: ${COMMUNITY_DATABASE_URL:jdbc:postgresql://localhost:5432/community}
    username: ${COMMUNITY_DATABASE_USER:community}
    password: ${COMMUNITY_DATABASE_PASSWORD:community-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    default-schema: public
  jackson:
    deserialization:
      # Reject unknown JSON fields (typos, stale clients). Request bodies are stored as documents, so an ignored
      # field would be lost without a word. Jackson 3 accepts them by default.
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8081/realms/wikiaov}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/wikiaov/protocol/openid-connect/certs}
          audiences: community-service
management:
  endpoints:
    web:
      exposure:
        include: health,info
community:
  security:
    # Clients (the token's azp) whose tokens carry capabilities. Stream tokens sign people in without any: Stream shares
    # the origin with user content, and a script injected there must not act as staff. The development realm also has
    # the older admin-aov client and wiki-local-cli.
    capability-clients: ${COMMUNITY_CAPABILITY_CLIENTS:admin-aov-backend,admin-aov,wiki-local-cli}
  wiki-base-url: ${WIKI_BASE_URL:http://localhost:8080}
  allowed-origins: ${COMMUNITY_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5175,http://127.0.0.1:5174,http://127.0.0.1:5175}
  exchange-rates:
    enabled: ${COMMUNITY_EXCHANGE_RATES_ENABLED:true}
    source-url: ${COMMUNITY_EXCHANGE_RATES_URL:https://api.frankfurter.dev}
    initial-delay: PT1M
    refresh-every: PT6H
    history-start: 2016-01-01
    # The units readers can pick, then every other unit tournaments were recorded in so far.
    currencies: VND,THB,TWD,IDR,EUR,TRY,PHP,BDT,JPY,KRW,HKD,SGD,INR,CNY,MYR,AUD,RUB,BRL
  youtube:
    # The Data API key, set in the environment only. Without it a page's YouTube channel is shown from its feed alone,
    # and only when the page links it by its id (ADR-034).
    api-key: ${YOUTUBE_API_KEY:}
    api-url: ${COMMUNITY_YOUTUBE_API_URL:https://www.googleapis.com/youtube/v3}
    feed-url: ${COMMUNITY_YOUTUBE_FEED_URL:https://www.youtube.com/feeds/videos.xml}
    # Google's free quota is 10,000 units a day; the rest is left for checks by hand.
    daily-units: 8000
    channel-ttl: PT24H
    videos-ttl: PT30M
