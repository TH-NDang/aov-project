server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: community-service
  datasource:
    url: ${COMMUNITY_DATABASE_URL:jdbc:postgresql://localhost:5432/community}
    username: ${COMMUNITY_DATABASE_USER:community}
    password: ${COMMUNITY_DATABASE_PASSWORD:community-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    default-schema: public
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8081/realms/wikiaov}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/wikiaov/protocol/openid-connect/certs}
          audiences: community-service
management:
  endpoints:
    web:
      exposure:
        include: health,info
community:
  wiki-base-url: ${WIKI_BASE_URL:http://localhost:8080}
  allowed-origins: ${COMMUNITY_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5175,http://127.0.0.1:5174,http://127.0.0.1:5175}
  exchange-rates:
    enabled: ${COMMUNITY_EXCHANGE_RATES_ENABLED:true}
    source-url: ${COMMUNITY_EXCHANGE_RATES_URL:https://api.frankfurter.dev}
    initial-delay: PT1M
    refresh-every: PT6H
    history-start: 2016-01-01
    # The units readers can pick, then every other unit tournaments were recorded in so far.
    currencies: VND,THB,TWD,IDR,EUR,TRY,PHP,BDT,JPY,KRW,HKD,SGD,INR,CNY,MYR,AUD,RUB,BRL
