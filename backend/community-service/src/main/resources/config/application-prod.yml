# Production profile. Values below have no default on purpose: a missing variable stops the service at startup,
# instead of silently falling back to the local development values of application.yml.
spring:
  datasource:
    url: ${COMMUNITY_DATABASE_URL}
    username: ${COMMUNITY_DATABASE_USER}
    password: ${COMMUNITY_DATABASE_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
server:
  # Only the reverse proxy can reach this port, and it overwrites X-Forwarded-*.
  forward-headers-strategy: native
management:
  endpoint:
    health:
      show-details: never
logging:
  structured:
    format:
      # JSON logs on stdout (Elastic Common Schema).
      console: ecs
community:
  security:
    capability-clients: ${COMMUNITY_CAPABILITY_CLIENTS:admin-aov-backend}
  wiki-base-url: ${WIKI_BASE_URL}
  allowed-origins: ${COMMUNITY_ALLOWED_ORIGINS}
