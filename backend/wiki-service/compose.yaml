services:
  redis:
    image: redis:8.2-alpine
    command: ['redis-server', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wiki}
      POSTGRES_USER: ${POSTGRES_USER:-wiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wiki-local}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
  # S3-compatible object storage for local development (ADR-006).
  # MinIO images were removed from Docker Hub in 09/2026; SeaweedFS speaks the same S3 API.
  # Credentials live in infra/local/seaweedfs/s3.json (local only).
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '${STORAGE_BIND_ADDRESS:-127.0.0.1}:8333:8333' # S3 API
      - '127.0.0.1:8888:8888' # filer UI: browse stored files
    volumes:
      - seaweedfs-data:/data
      - ./infra/local/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    profiles: [identity]
    # Imports infra/local/keycloak/wikiaov-realm.json on first start (skipped when the realm already exists).
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local}
      ADMIN_AUTH_CLIENT_SECRET: ${ADMIN_AUTH_CLIENT_SECRET:-}
    ports:
      - '127.0.0.1:8081:8080'
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infra/local/keycloak:/opt/keycloak/data/import:ro
volumes:
  postgres-data:
  seaweedfs-data:
  keycloak-data:
