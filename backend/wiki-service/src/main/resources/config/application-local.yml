spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wiki}
    username: ${DB_USERNAME:wiki}
    password: ${DB_PASSWORD:wiki-local}
  docker:
    compose:
      enabled: true
      file: compose.yaml
      lifecycle-management: start-only
  # Mailpit from compose.yaml (profile "mail"): no authentication or TLS on loopback.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak from compose.yaml (profile "identity"), imported from infra/local/keycloak/wikiaov-realm.json.
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/wikiaov}

wiki:
  security:
    # The development realm also has the older admin-aov client and wiki-local-cli, which the local scripts sign in with.
    capability-clients: ${JWT_CAPABILITY_CLIENTS:admin-aov-backend,wiki-importer,admin-aov,wiki-local-cli}
  account:
    mail:
      from: ${MAIL_FROM:AOV <no-reply@aov.localhost>}
  read-model-cache:
    enabled: ${READ_MODEL_CACHE_ENABLED:true}
  auth:
    secure-cookies: false
    admin-origin: ${ADMIN_ORIGIN:http://localhost:5175}
  # Object storage is Cloudflare R2, configured by the STORAGE_* values of an ignored environment file (.env or .env.r2)
  # that scripts/dev/start-local.ps1 loads (ADR-030 section 14). The bundled SeaweedFS needs the "local-storage" profile.
  storage:
    create-bucket-if-missing: ${STORAGE_CREATE_BUCKET_IF_MISSING:false}
