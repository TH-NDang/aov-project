spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wiki}
    username: ${DB_USERNAME:wiki}
    password: ${DB_PASSWORD:wiki-local}
  docker:
    compose:
      enabled: true
      file: compose.yaml
      lifecycle-management: start-only
  # Mailpit from compose.yaml (profile "mail"): no authentication or TLS on loopback.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak from compose.yaml (profile "identity"), imported from infra/local/keycloak/wikiaov-realm.json.
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/wikiaov}

wiki:
  account:
    mail:
      from: ${MAIL_FROM:AOV <no-reply@aov.localhost>}
  read-model-cache:
    enabled: ${READ_MODEL_CACHE_ENABLED:true}
  auth:
    secure-cookies: false
    admin-origin: ${ADMIN_ORIGIN:http://localhost:5175}
  storage:
    # SeaweedFS from compose.yaml; keys match infra/local/seaweedfs/s3.json.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:8333}
    access-key: ${STORAGE_ACCESS_KEY:wiki-local}
    secret-key: ${STORAGE_SECRET_KEY:wiki-local-storage}
    create-bucket-if-missing: ${STORAGE_CREATE_BUCKET_IF_MISSING:true}
    # Browser origins allowed to PUT presigned uploads: admin media and stream avatars. Cloud buckets (R2) are
    # configured in the provider instead, see infra/cloudflare/upload-cors.json.
    upload-origins: ${ADMIN_ORIGIN:http://localhost:5175},http://localhost:5174
