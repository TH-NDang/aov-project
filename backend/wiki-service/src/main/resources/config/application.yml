spring:
  application:
    name: wiki-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:200ms}
      timeout: ${REDIS_TIMEOUT:200ms}
      ssl:
        enabled: ${REDIS_SSL:false}
  # Account security email (ADR-028). Without a host or wiki.account.mail.from, password changes are unavailable.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      enabled: false
  jackson:
    deserialization:
      # Reject unknown JSON fields (typos, stale clients). Jackson 3 accepts them by default.
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm URL, e.g. https://auth.example.com/realms/wikiaov
          issuer-uri: ${JWT_ISSUER_URI}
          audiences: ${JWT_AUDIENCE:wiki-service}

server:
  port: ${PORT:8080}

management:
  health:
    # The cache is optional; losing Redis must not make the database-backed API unready.
    redis:
      enabled: false
    # Account email is optional (ADR-028); a missing SMTP server only disables password changes.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info


wiki:
  # Patch watch (ADR-035): reads the publishers' patch-note pages on the schedule set in Admin. The Indonesian list
  # needs the page reader (a headless browser) that only the server stack runs; without its address that source waits.
  # Editors may rewrite recorded hero patch changes while the data is not official (ADR-016, 2026-11-27). Set
  # HERO_CHANGE_EDITS=false to lock them again.
  hero:
    change-edits: ${HERO_CHANGE_EDITS:true}
  patch-watch:
    enabled: ${PATCH_WATCH_ENABLED:true}
    page-reader-url: ${PATCH_WATCH_PAGE_READER_URL:}
  read-model-cache:
    enabled: ${READ_MODEL_CACHE_ENABLED:false}
    prefix: ${READ_MODEL_CACHE_PREFIX:wiki:read-model:v1}
    public-ttl: ${READ_MODEL_CACHE_PUBLIC_TTL:2m}
    admin-ttl: ${READ_MODEL_CACHE_ADMIN_TTL:30s}
    retry-delay: ${READ_MODEL_CACHE_RETRY_DELAY:5s}
    max-value-bytes: ${READ_MODEL_CACHE_MAX_VALUE_BYTES:8388608}
  account:
    keycloak:
      client-id: ${WIKI_SERVICE_CLIENT_ID:wiki-service}
      client-secret: ${WIKI_SERVICE_CLIENT_SECRET:}
    mail:
      from: ${MAIL_FROM:}
      product-name: ${MAIL_PRODUCT_NAME:AOV}
  user:
    profile-defaults:
      locale: ${USER_DEFAULT_LOCALE:vi-VN}
      time-zone: ${USER_DEFAULT_TIME_ZONE:Asia/Ho_Chi_Minh}
  auth:
    admin-origin: ${ADMIN_ORIGIN:https://localhost}
    admin-base-path: ${ADMIN_BASE_PATH:/}
    client-id: ${ADMIN_AUTH_CLIENT_ID:admin-aov-backend}
    client-secret: ${ADMIN_AUTH_CLIENT_SECRET:}
    secure-cookies: ${AUTH_SECURE_COOKIES:true}
    google-enabled: ${GOOGLE_LOGIN_ENABLED:false}
    google-callback-path: ${GOOGLE_CALLBACK_PATH:/api/wiki/v1/auth/google/callback}
  security:
    # Client whose client roles (resource_access.<client>.roles) carry the capabilities.
    resource-client-id: ${JWT_RESOURCE_CLIENT_ID:wiki-service}
    # Clients (the token's azp) whose tokens carry those capabilities. Tokens of the public Wiki and Stream sign people
    # in without any: those apps share the origin with user content, and a script injected there must not act as admin.
    capability-clients: ${JWT_CAPABILITY_CLIENTS:admin-aov-backend,wiki-importer}
  storage:
    # Any S3-compatible service (ADR-006): Cloudflare R2 for development and production, SeaweedFS in tests.
    endpoint: ${STORAGE_ENDPOINT:}
    # Browser-facing endpoint for presigned URLs when the service reaches storage over a private network.
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:wiki-media}
    assets-bucket: ${STORAGE_ASSETS_BUCKET:}
    # Private bucket for source files under sources/ (ADR-030); empty uses the private bucket.
    sources-bucket: ${STORAGE_SOURCES_BUCKET:}
    # Optional real R2 figures in Admin (ADR-030 section 9): a token with only "Account Analytics: Read".
    analytics:
      account-id: ${CLOUDFLARE_ACCOUNT_ID:}
      api-token: ${CLOUDFLARE_ANALYTICS_TOKEN:}
    path-style-access: ${STORAGE_PATH_STYLE:true}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    create-bucket-if-missing: false
    # Sign the declared size into presigned uploads so storage refuses a larger body. R2 does not document that it
    # checks a signed Content-Length: turn on after one upload on the development buckets has gone through.
    sign-upload-size: ${STORAGE_SIGN_UPLOAD_SIZE:false}
  # Private source files: evidence captures and import data (ADR-030).
  sources:
    max-upload-size: 2GB
    link-validity: 10m
  media:
    # Media policy (01 section 13.5). Only PNG, JPEG and WebP are accepted.
    max-upload-size: 25MB
    max-pixels: 40000000
    max-dimension: 16384
    upload-url-validity: 15m
    upload-session-validity: 1h
    # How long the asset list keeps its answer about where every image is used.
    usage-report-lifetime: 1m
    validation-timeout: 5m
    # Prefix that serves the assets/ prefix of the bucket (reverse proxy or CDN).
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:/media}
    # Resized copies made through Cloudflare's image transformations right after an upload, so the first reader does
    # not wait for them. Empty makes none; production lists the widths the Wiki asks for most (sized-image.ts).
    warm:
      widths: ${MEDIA_WARM_WIDTHS:}
    deletion:
      community-base-url: ${COMMUNITY_API_BASE_URL:http://localhost:8082}
      cloudflare-enabled: ${MEDIA_CLOUDFLARE_PURGE_ENABLED:false}
      cloudflare-zone-id: ${CLOUDFLARE_ZONE_ID:}
      cloudflare-api-token: ${CLOUDFLARE_CACHE_PURGE_TOKEN:}

logging:
  pattern:
    # Adds the request id to every log line in the default (human-readable) format.
    level: "%5p [%X{requestId:-}]"

# The existing admin URL rule protects the generated JSON/YAML specification.
# No Swagger UI or public documentation security exception is installed.
springdoc:
  api-docs:
    path: /api/wiki/v1/admin/openapi
  paths-to-match: /api/wiki/**
  default-produces-media-type: application/json
  use-fqn: true
  override-with-generic-response: false
  writer-with-order-by-keys: true
