spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wiki}
    username: ${DB_USERNAME:wiki}
    password: ${DB_PASSWORD:wiki-local}
  docker:
    compose:
      enabled: true
      file: compose.yaml
      lifecycle-management: start-only
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak from compose.yaml (profile "identity"), realm imported from keycloak/wikiaov-realm.json.
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/wikiaov}

wiki:
  storage:
    # SeaweedFS from compose.yaml; keys match seaweedfs/s3.json.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:8333}
    access-key: ${STORAGE_ACCESS_KEY:wiki-local}
    secret-key: ${STORAGE_SECRET_KEY:wiki-local-storage}
    create-bucket-if-missing: true
