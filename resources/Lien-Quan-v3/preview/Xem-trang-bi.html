<script>
const data=JSON.parse(document.querySelector('#data').textContent), byId=new Map(data.items.map(x=>[x.id,x]));
let group="Công";
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
function card(x){const p=x.shopPosition;return `<button class="item" data-id="${esc(x.id)}"><img src="${esc(x.image)}" alt="${esc(x.name)}"><span><strong>${esc(x.name)}</strong><small class="price">${x.price.toLocaleString('vi-VN')} vàng · Cấp ${x.tier}</small><small>${esc(x.summary)}</small><small>Vị trí: ${p.group}, ${p.row??'?'}, ${p.column??'?'}${x.shopPosition.variant?' · '+esc(x.shopPosition.variant):''}</small></span></button>`}
function draw(){
 $('#categories').innerHTML=data.categories.map(c=>`<button data-group="${esc(c.name)}" aria-pressed="${c.name===group}">${esc(c.name)}</button>`).join('');
 $('#variant').hidden=group!=="Phụ trợ";
 let q=norm($('#search').value),variant=$('#variant').value;
 let items=data.items.flatMap(x=>x.shopPositions.map(p=>({...x,shopPosition:p}))).filter(x=>x.shopPosition.group===group&&(!q||norm(x.name+' '+x.id).includes(q))&&(group!=="Phụ trợ"||!variant||!x.shopPosition.variant||x.shopPosition.variant===variant));
 $('#count').textContent=items.length+' trang bị · Bấm để xem mô tả và liên kết nâng cấp. Các ảnh cùng ô được xếp chồng, không ghi đè nhau.';
 const cells=new Map();for(const x of items){const p=x.shopPosition;if(p.row===null)continue;let k=p.row+','+p.column;if(!cells.has(k))cells.set(k,[]);cells.get(k).push(x)}
 $('#grid').innerHTML=[0,1,2].map(c=>`<div class="col" style="grid-column:${c+1};grid-row:1">Cột ${c}</div>`).join('')+[...cells.entries()].map(([key,xs])=>{const [r,c]=key.split(',').map(Number);return `<div class="cell" style="grid-row:${r+2};grid-column:${c+1}">${xs.map(card).join('')}</div>`}).join('');
 let unknown=items.filter(x=>x.shopPosition.row===null);$('#unknown').innerHTML=unknown.length?'<h3>Chưa có vị trí trong Excel</h3><div class="unknown">'+unknown.map(card).join('')+'</div>':'';
}
function show(id){const x=byId.get(id);if(!x)return;let desc=x.description;if(desc.startsWith('"')&&desc.endsWith('"'))desc=desc.slice(1,-1);
 const r=x.recipe;
 let relations='<h3>Ghép từ</h3>'+(r.status==='unverified'?'<p>Chưa có đủ dữ liệu công thức.</p>':r.status==='none'?'<p>Không cần ghép.</p>':'<div class="relations">'+r.components.map(c=>`<button class="link" data-id="${esc(c.itemId)}">${esc(c.name)} × ${c.quantity}</button>`).join('')+'</div>');
 if(r.combineCost!==null)relations+=`<p>Phí ghép: ${r.combineCost} vàng</p>`;
 relations+='<h3>Nâng cấp thành</h3><div class="relations">'+x.buildsInto.map(c=>`<button class="link" data-id="${esc(c.itemId)}">${esc(c.name)}</button>`).join('')+'</div>';
 if(!x.buildsIntoComplete)relations+='<p>Danh sách nâng cấp chưa đầy đủ vì còn công thức chưa xác nhận.</p>';
 $('#detail-content').innerHTML=`<div class="detail-head"><img src="${esc(x.image)}" alt="${esc(x.name)}"><div><h2>${esc(x.name)}</h2><p>${x.price.toLocaleString('vi-VN')} vàng · Cấp ${x.tier}<br>${esc(x.id)}</p></div></div><p>${esc(x.summary)}</p><div class="description">${esc(desc)}</div>${relations}<p>Vị trí và mô tả theo Excel. Xem can-kiem-tra.json để đối chiếu dữ liệu.</p><a href="${esc(x.image)}" download>Tải ảnh</a>`;
 if(!$('#detail').open)$('#detail').showModal();
}
document.addEventListener('click',e=>{let b=e.target.closest('[data-id]');if(b)show(b.dataset.id);let c=e.target.closest('[data-group]');if(c){group=c.dataset.group;draw()}});
$('.close').onclick=()=>$('#detail').close();$('#search').oninput=draw;$('#variant').onchange=draw;draw();
</script></html>
