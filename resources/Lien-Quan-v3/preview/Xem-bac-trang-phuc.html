<!doctype html><html lang="vi"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bậc trang phục · Liên Quân</title><style>:root{color-scheme:dark}body{margin:0;background:#0d1625;color:#eef2fa;font:15px/1.5 Segoe UI,Arial}header,main{padding:24px 30px;max-width:1440px;margin:auto}h1{margin:10px 0}p{color:#adbed5}input,select,button{font:inherit;color:inherit;background:#18283e;border:1px solid #405570;border-radius:8px;padding:10px;margin:4px 8px 4px 0}input{width:min(400px,85vw)}button{cursor:pointer}a{color:#e4c686}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:15px}.card{padding:12px;margin:0;background:#18273d;border-radius:10px;border:1px solid #35475f;cursor:pointer;display:grid;gap:10px;text-align:left;overflow-wrap:anywhere}.card img{width:100%;height:150px;object-fit:contain;background:#0a1322;border-radius:6px}.card span{font-size:12px;color:#acbed6}.more{display:block;margin:26px auto}dialog{color:inherit;background:#132137;border:1px solid #617593;border-radius:12px;width:min(1000px,94vw);max-height:92vh}dialog::backdrop{background:#000b}dialog img{width:100%;max-height:68vh;object-fit:contain}dialog h2{font-size:21px}dialog button{float:right}#file{display:block;overflow-wrap:anywhere}</style></head><body><header><a href="preview/index.html">← Thư viện dữ liệu</a><h1>Bậc trang phục</h1><p>Ảnh dùng cùng JSON tướng và trang phục; bấm ảnh để xem lớn.</p><input id="search" type="search" placeholder="Tìm tướng, trang phục hoặc tên bậc…" aria-label="Tìm ảnh"><p id="count"></p></header><main><div id="grid" class="grid"></div><button id="more" class="more">Xem thêm</button></main><dialog id="detail"><button id="close" aria-label="Đóng">✕</button><h2 id="title"></h2><img id="preview" alt=""><a id="file" target="_blank"></a></dialog><script src="program/shared/data.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d').toLowerCase();
let rows=[],filtered=[],limit=72;rows=HERO_DATA.badges.map(b=>({title:b.id.replace(/-/g,' '),file:b.icon,note:b.id}));
function render(){const q=norm($('search').value),group=$('group')?.value;filtered=rows.filter(r=>(!q||norm(r.title+' '+r.file+' '+r.note).includes(q))&&(!group||r.group===group));$('grid').innerHTML=filtered.slice(0,limit).map((r,i)=>`<button class="card" data-row="${i}"><img loading="lazy" decoding="async" src="${esc(r.file)}" alt="${esc(r.title)}"><strong>${esc(r.title)}</strong><span>${esc(r.note)}</span></button>`).join('');$('count').textContent=filtered.length+' ảnh · hiện '+Math.min(limit,filtered.length);$('more').hidden=limit>=filtered.length;}
$('search').addEventListener('input',()=>{limit=72;render()});$('group')?.addEventListener('change',()=>{limit=72;render()});$('more').addEventListener('click',()=>{limit+=72;render()});$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-row]');if(!b)return;const r=filtered[Number(b.dataset.row)];$('title').textContent=r.title;$('preview').src=r.file;$('preview').alt=r.title;$('file').href=r.file;$('file').textContent=r.file;$('detail').showModal();});$('close').addEventListener('click',()=>$('detail').close());render();</script></body></html>
