<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/stream-owl.svg" />
    <meta name="theme-color" content="#121220" />
    <title data-static-head>AOV Stream — Giải đấu Liên Quân Mobile</title>
    <meta
      data-static-head
      name="description"
      content="Lịch thi đấu, kết quả, bảng xếp hạng, đội tuyển và tuyển thủ các giải đấu Liên Quân Mobile."
    />
    <meta data-static-head property="og:site_name" content="AOV Stream" />
    <meta data-static-head property="og:title" content="AOV Stream — Giải đấu Liên Quân Mobile" />
    <meta
      data-static-head
      property="og:description"
      content="Lịch thi đấu, kết quả, bảng xếp hạng, đội tuyển và tuyển thủ các giải đấu Liên Quân Mobile."
    />
    <script>
      // Apply a stored light/dark choice before the first paint; otherwise the system preference decides.
      try {
        const theme = localStorage.getItem("aov-stream-theme")
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
