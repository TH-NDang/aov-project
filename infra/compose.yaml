# The whole system on one machine, the way production runs it. See README.md (Vietnamese) in this folder.
# Every value comes from .env; only .env.example is tracked.
name: aov-stack

# The issuer in every token, and so in every row that names a person; dev-import moves older rows to it.
x-public-issuer: &public-issuer ${PUBLIC_ORIGIN:?set in .env}/idp/realms/wikiaov

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# Object storage is Cloudflare R2 (ADR-021, ADR-030). Its values default to empty instead of stopping Compose, so that
# preflight can list every one that is missing at once.
x-storage-tool: &storage-tool
  image: rclone/rclone:1.71
  entrypoint: ["/bin/sh", "/scripts/media.sh"]
  environment:
    RCLONE_CONFIG_STORE_TYPE: s3
    RCLONE_CONFIG_STORE_PROVIDER: Cloudflare
    RCLONE_CONFIG_STORE_ENDPOINT: ${STORAGE_ENDPOINT:-}
    RCLONE_CONFIG_STORE_REGION: ${STORAGE_REGION:-auto}
    RCLONE_CONFIG_STORE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-}
    RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-}
    RCLONE_CONFIG_STORE_FORCE_PATH_STYLE: ${STORAGE_PATH_STYLE:-true}
    # Buckets are prepared on Cloudflare (ADR-014); never try to create one.
    RCLONE_CONFIG_STORE_NO_CHECK_BUCKET: "true"
    STORAGE_BUCKET: ${STORAGE_BUCKET:-}
    STORAGE_ASSETS_BUCKET: ${STORAGE_ASSETS_BUCKET:-}
    STORAGE_SOURCES_BUCKET: ${STORAGE_SOURCES_BUCKET:-}
  logging: *logging

x-database-tool: &database-tool
  image: postgres:17.6
  environment:
    PGUSER: ${POSTGRES_SUPERUSER:?set in .env}
    PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
    BACKUP_KEEP: ${BACKUP_KEEP:-10}
  volumes:
    - ./backups:/backups
    - ./scripts:/scripts:ro
  logging: *logging

services:
  # One-shot: stops the start while an R2 value is missing, or when a public origin still has sample secrets.
  preflight:
    image: postgres:17.6
    entrypoint: ["/bin/sh", "/scripts/preflight.sh"]
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set in .env}
      AUTH_SECURE_COOKIES: ${AUTH_SECURE_COOKIES:-true}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      WIKI_DB_PASSWORD: ${WIKI_DB_PASSWORD:?set in .env}
      COMMUNITY_DB_PASSWORD: ${COMMUNITY_DB_PASSWORD:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      ADMIN_AUTH_CLIENT_SECRET: ${ADMIN_AUTH_CLIENT_SECRET:?set in .env}
      WIKI_IMPORTER_CLIENT_SECRET: ${WIKI_IMPORTER_CLIENT_SECRET:?set in .env}
      WIKI_SERVICE_CLIENT_SECRET: ${WIKI_SERVICE_CLIENT_SECRET:?set in .env}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ASSETS_BUCKET: ${STORAGE_ASSETS_BUCKET:-}
      STORAGE_SOURCES_BUCKET: ${STORAGE_SOURCES_BUCKET:-}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      MEDIA_CLOUDFLARE_PURGE_ENABLED: ${MEDIA_CLOUDFLARE_PURGE_ENABLED:-false}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_CACHE_PURGE_TOKEN: ${CLOUDFLARE_CACHE_PURGE_TOKEN:-}
    volumes:
      - ./scripts:/scripts:ro
    logging: *logging

  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_DB: postgres
      WIKI_DB_PASSWORD: ${WIKI_DB_PASSWORD:?set in .env}
      COMMUNITY_DB_PASSWORD: ${COMMUNITY_DB_PASSWORD:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      # Over TCP on purpose: while the databases are created the image only listens on its Unix socket.
      test: ["CMD-SHELL", 'pg_isready --host=127.0.0.1 --username="$${POSTGRES_USER}" --dbname=keycloak']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      preflight:
        condition: service_completed_successfully
    logging: *logging

  # One-shot on every `up`, before the services start and Flyway migrates. Keeps the newest BACKUP_KEEP dumps.
  db-backup:
    <<: *database-tool
    entrypoint: ["/bin/sh", "/scripts/db-backup.sh"]
    environment:
      PGUSER: ${POSTGRES_SUPERUSER:?set in .env}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      BACKUP_KEEP: ${BACKUP_KEEP:-10}
      BACKUP_LABEL: auto
    depends_on:
      postgres:
        condition: service_healthy

  # Run by hand: docker compose run --rm db-restore <folder>
  db-restore:
    <<: *database-tool
    profiles: [ops]
    entrypoint: ["/bin/sh", "/scripts/db-restore.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # Run by hand when the stack takes over the development data: docker compose run --rm dev-import <folder>.
  # Replaces the wiki and community databases with the export and moves its accounts to the issuer of this stack.
  dev-import:
    <<: *database-tool
    profiles: [ops]
    entrypoint: ["/bin/sh", "/scripts/dev-import.sh"]
    environment:
      PGUSER: ${POSTGRES_SUPERUSER:?set in .env}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      STACK_ISSUER: *public-issuer
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    # A cache that can be lost (ADR-012): no persistence, bounded memory, reachable only on this network.
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${REDIS_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
    logging: *logging

  # Run by hand: docker compose run --rm media-backup. Copies new R2 objects into backups/media/.
  media-backup:
    <<: *storage-tool
    profiles: [ops]
    command: ["backup"]
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro

  # Run by hand: docker compose run --rm media-restore. Puts back the objects missing from R2.
  media-restore:
    <<: *storage-tool
    profiles: [ops]
    command: ["restore"]
    volumes:
      - ./backups:/backups:ro
      - ./scripts:/scripts:ro

  keycloak:
    image: aov/keycloak:${IMAGE_TAG:-local}
    build: &keycloak-build
      context: ../backend/wiki-service/infra/local/keycloak-themes
      dockerfile: ../../../../../infra/keycloak/Dockerfile
      additional_contexts:
        keycloak: ./keycloak
    restart: unless-stopped
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      # Tokens always carry the public address; the services call Keycloak on this network.
      KC_HOSTNAME: ${PUBLIC_ORIGIN:?set in .env}/idp
      KC_HOSTNAME_ADMIN: http://localhost:${KEYCLOAK_ADMIN_PORT:-18081}/idp
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Placeholders of the realm template.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set in .env}
      ADMIN_AUTH_CLIENT_SECRET: ${ADMIN_AUTH_CLIENT_SECRET:?set in .env}
      WIKI_IMPORTER_CLIENT_SECRET: ${WIKI_IMPORTER_CLIENT_SECRET:?set in .env}
      WIKI_SERVICE_CLIENT_SECRET: ${WIKI_SERVICE_CLIENT_SECRET:?set in .env}
    ports:
      # The admin console is not on the public listener: use it from this machine or through an SSH tunnel.
      - 127.0.0.1:${KEYCLOAK_ADMIN_PORT:-18081}:8080
    mem_limit: ${KEYCLOAK_MEM_LIMIT:-1536m}
    depends_on:
      db-backup:
        condition: service_completed_successfully
    logging: *logging

  # One-shot, profile "test-identity": sign-in accounts for trying the system. Not for a public origin.
  keycloak-test-users:
    image: aov/keycloak:${IMAGE_TAG:-local}
    build: *keycloak-build
    profiles: [test-identity]
    entrypoint: ["/bin/bash", "/scripts/create-test-users.sh"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:-}
    volumes:
      - ./keycloak/create-test-users.sh:/scripts/create-test-users.sh:ro
    healthcheck:
      disable: true
    depends_on:
      keycloak:
        condition: service_healthy
    logging: *logging

  # Run by hand right after dev-import: docker compose run --rm dev-users-import <folder>. Adds the development
  # accounts with their ids, so that the moved data still names them; refuses a realm that already has people.
  dev-users-import:
    image: aov/keycloak:${IMAGE_TAG:-local}
    build: *keycloak-build
    profiles: [ops]
    entrypoint: ["/bin/bash", "/scripts/import-dev-users.sh"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      # The test accounts of backend/wiki-service/infra/local/keycloak/wikiaov-realm.json, whose passwords are public.
      DISABLED_USERNAMES: admin editor publisher
    volumes:
      - ./keycloak/import-dev-users.sh:/scripts/import-dev-users.sh:ro
      - ./backups/db:/backups/db:ro
    healthcheck:
      disable: true
    depends_on:
      keycloak:
        condition: service_healthy
    logging: *logging

  wiki-service:
    image: aov/wiki-service:${IMAGE_TAG:-local}
    build:
      context: ../backend/wiki-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/wiki
      DB_USERNAME: wiki
      DB_PASSWORD: ${WIKI_DB_PASSWORD:?set in .env}
      JWT_ISSUER_URI: *public-issuer
      JWT_BACKCHANNEL_ISSUER_URI: http://keycloak:8080/idp/realms/wikiaov
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/idp/realms/wikiaov/protocol/openid-connect/certs
      ADMIN_ORIGIN: ${PUBLIC_ORIGIN:?set in .env}
      ADMIN_BASE_PATH: /admin/
      ADMIN_AUTH_CLIENT_SECRET: ${ADMIN_AUTH_CLIENT_SECRET:?set in .env}
      # Account security (ADR-028): service account and token exchange of the wiki-service client.
      WIKI_SERVICE_CLIENT_SECRET: ${WIKI_SERVICE_CLIENT_SECRET:?set in .env}
      # Password change codes go out over SMTP; without a host or sender the settings page cannot change passwords.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      AUTH_SECURE_COOKIES: ${AUTH_SECURE_COOKIES:-true}
      GOOGLE_LOGIN_ENABLED: ${GOOGLE_LOGIN_ENABLED:-false}
      # Cloudflare R2; preflight has checked these values. Browsers upload and read source files straight from R2 with
      # presigned URLs, and public images come from the bucket's own domain: no byte passes this stack.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      # Empty writes STORAGE_ENDPOINT into presigned URLs, which browsers reach as well.
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ASSETS_BUCKET: ${STORAGE_ASSETS_BUCKET:-}
      STORAGE_SOURCES_BUCKET: ${STORAGE_SOURCES_BUCKET:-}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-true}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      MEDIA_CLOUDFLARE_PURGE_ENABLED: ${MEDIA_CLOUDFLARE_PURGE_ENABLED:-false}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_CACHE_PURGE_TOKEN: ${CLOUDFLARE_CACHE_PURGE_TOKEN:-}
      # Optional real R2 usage in Admin (ADR-030 section 9); empty shows the database figures only.
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_ANALYTICS_TOKEN: ${CLOUDFLARE_ANALYTICS_TOKEN:-}
      COMMUNITY_API_BASE_URL: http://community-service:8082
      READ_MODEL_CACHE_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
    mem_limit: ${WIKI_MEM_LIMIT:-1536m}
    depends_on:
      db-backup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    logging: *logging

  community-service:
    image: aov/community-service:${IMAGE_TAG:-local}
    build:
      context: ../backend/community-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      COMMUNITY_DATABASE_URL: jdbc:postgresql://postgres:5432/community
      COMMUNITY_DATABASE_USER: community
      COMMUNITY_DATABASE_PASSWORD: ${COMMUNITY_DB_PASSWORD:?set in .env}
      KEYCLOAK_ISSUER: *public-issuer
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/idp/realms/wikiaov/protocol/openid-connect/certs
      WIKI_BASE_URL: http://wiki-service:8080
      COMMUNITY_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?set in .env}
      COMMUNITY_EXCHANGE_RATES_ENABLED: ${COMMUNITY_EXCHANGE_RATES_ENABLED:-true}
    mem_limit: ${COMMUNITY_MEM_LIMIT:-768m}
    depends_on:
      db-backup:
        condition: service_completed_successfully
    logging: *logging

  reverse-proxy:
    image: aov/reverse-proxy:${IMAGE_TAG:-local}
    build: &frontend-build
      context: ../frontend
      dockerfile: ../infra/proxy/Dockerfile
      additional_contexts:
        proxy: ./proxy
      args:
        VITE_AUTH_ISSUER: ${PUBLIC_ORIGIN:?set in .env}/idp/realms/wikiaov
        VITE_WIKI_URL: ${PUBLIC_ORIGIN:?set in .env}/
        VITE_STREAM_URL: ${PUBLIC_ORIGIN:?set in .env}/stream
        VITE_ADMIN_URL: ${PUBLIC_ORIGIN:?set in .env}/admin
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - ${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-18080}:80
      - ${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-18443}:443
    volumes:
      - caddy-data:/data
      - wiki-site:/srv/wiki:ro
    depends_on:
      wiki-service:
        condition: service_healthy
      community-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # Waits for it but starts either way: a failed run leaves the pages online, and "up --wait" reports the failure.
      wiki-prerender:
        condition: service_completed_successfully
        required: false
      # So that a failure here fails the start, and "up --wait" returns only when the accounts exist.
      keycloak-test-users:
        condition: service_completed_successfully
        required: false
    logging: *logging

  # One-shot on every `up`, and by hand after publishing: docker compose run --rm wiki-prerender (ADR-022).
  wiki-prerender:
    image: aov/wiki-prerender:${IMAGE_TAG:-local}
    build:
      <<: *frontend-build
      target: wiki-prerender
    environment:
      VITE_WIKI_URL: ${PUBLIC_ORIGIN:?set in .env}
      WIKI_API_TARGET: http://wiki-service:8080
      WIKI_SITE_DIR: /site
    volumes:
      - wiki-site:/site
    depends_on:
      wiki-service:
        condition: service_healthy
    logging: *logging

volumes:
  postgres-data:
  caddy-data:
  wiki-site:
